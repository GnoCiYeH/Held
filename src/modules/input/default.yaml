normal:
  left: cursor::move_left
  right: cursor::move_right
  up: cursor::move_up
  down: cursor::move_down
  ctrl-c: app::exit
  i: app::to_insert_mode
  backspace: cursor::move_left
  w: app::to_workspace_mode
  tab: workspace::next_observation_buffer
  "=": monitor::zoom_up
  "-": monitor::zoom_down
insert:
  escape: app::to_normal_mode
  left: cursor::move_left
  right: cursor::move_right
  up: cursor::move_up
  down: cursor::move_down
  ctrl-c: app::exit
  ctrl-s: workspace::save_file
  ctrl-z: workspace::undo
  enter: 
    - buffer::new_line
    - cursor::move_down
    - cursor::move_to_start_of_line
  backspace: insert::backspace
  tab: buffer::insert_tab
  _: 
    - buffer::insert_char
workspace:
  up: workspace::move_up
  down: workspace::move_down
  enter: workspace::enter
  escape: workspace::to_normal_mode
  c: workspace::close_dir_tree
  v: workspace::open_with_vertical
  h: workspace::open_with_horizon
  ctrl-c: app::exit